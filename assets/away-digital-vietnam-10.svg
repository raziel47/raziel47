  </g>
  <text x="462" y="66" fill="#111" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">YEARS IN</text>
  <text x="462" y="88" fill="#111" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">VIETNAM</text>
